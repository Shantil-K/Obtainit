[package]
name = "lifter-core"
description = "The download/scrape/extract engine from lifter (github.com/cjrh/lifter), as a reusable library"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
log = "0.4"
regex = "1"
url = "2.5"
ureq = "3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonpath-rust = "1.0"
scraper = "0.27"
itertools = "0.14"
zip = "9.0"
flate2 = "1.1"
tar = "0.4"
xz2 = "0.1"
zstd = "0.13"
bzip2 = "0.6"
sha2 = "0.10"
tini = "1.3"
strfmt = "0.2"

[dev-dependencies]
tempfile = "3"
