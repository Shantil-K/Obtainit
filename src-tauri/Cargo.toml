[package]
name = "obtainit"
description = "Obtainium-style updater for GitHub (and other) releases on Linux and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "obtainit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
lifter-core = { path = "../crates/lifter-core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
regex = "1"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
which = "8"

[dev-dependencies]
tempfile = "3"
